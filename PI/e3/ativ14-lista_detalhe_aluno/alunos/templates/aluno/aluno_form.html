{% extends "base.html" %}
{% load static %}

{% block extra_head %}
    <link rel="stylesheet" href="{% static 'css/alunos.css' %}">
{% endblock %}

{% block content %}
<h1>Adicionar Aluno</h1>

<form action="/criar_aluno/" method="post">
    <label for="nome_aluno">Nome do aluno</label>
    <input type="text" id="nome_aluno" name="nome_aluno">

    <label for="matricula_aluno">Matrículo do aluno
    </label>
    <input type="text" id="matricula_aluno" name="matricula_aluno">

    <label for="idade_aluno">Idade do aluno</label>
    <input type="number" id="idade_aluno" name="idade_aluno">

    <label for="curso_aluno">Curso do aluno</label>
    <input type="text" id="curso_aluno" name="curso_aluno">

    <input type="submit" value="Criar Aluno">
</form>
{% endblock %}
