{% extends 'base.html' %}
{% load static %}

{% block title %}
    Portal Escolar — Categorias
{% endblock title %}

{% block content %}
      <div class="titulo-pagina ttl-btn">
        <h1>Listagem de categorias</h1>
        <a href="{% url 'noticias:categoria_criar' %}" class="btn btn-primary">Criar categoria</a>
      </div>

      <table class="tabela">
        <thead>
          <tr>
            <th>Nome</th>
          </tr>
        </thead>
        <tbody>
            {% for cat in categorias %}
          <tr><td><a href="{% url 'noticias:categoria_detalhes' cat.id %}">{{ cat.nome }}</a></td></tr>
            {% endfor %}
        </tbody>
      </table>
{% endblock content %}
