{% extends 'base.html' %}
{% load static %}

{% block title %}Portal Escolar — Tags{% endblock title %}

{% block content %}
      
      <div class="titulo-pagina ttl-btn">
        <h1>Listagem de Tags</h1>
        <a href="{% url 'noticias:tag_criar' %}" class="btn btn-primary">Criar Tag</a>
      </div>

      <table class="tabela">
        <thead>
          <tr>
            <th>Título</th>
          </tr>
        </thead>
        <tbody>
            {% for tag in tags %}
          <tr><td><a href="{% url 'noticias:tag_detalhes' tag.id %}">{{ tag }}</a></td></tr>
            {% endfor %}

        </tbody>
      </table>
{% endblock content %}
