{% extends 'base.html' %}
{% load static %}

{% block content %}
<main>

    <h1>Lista de Produtos</h1>

    <br>

    <table>

        <tr>
            <th>Detalhes</th>
            <th>ID</th>
            <th>Nome do Produto</th>
            <th>Categoria</th>
            <th>Preço</th>
        </tr>

        {% for produto in produtos %}
            <tr>
                <td><a href="{% url 'produtos:detalhes' produto.id %}">Detalhes</a></td>
                <td>{{ produto.id }}</td>
                <td>{{ produto.nome }}</td>
                <td>{{ produto.categoria }}</td>
                <td>R$ {{ produto.preco }}</td>
            </tr>
        {% endfor %}

    </table>

</main>
{% endblock content %}
